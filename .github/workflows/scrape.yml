name: Scrape USAMLS listings

on:
  schedule:
    # 03:00 UTC (10-11pm US Eastern, off-peak) nightly.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-usamls
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Scrape all listings
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'dagrealty' }}
        run: uv run scraper/run.py --all --trigger scheduled

      - name: Backfill listing photos
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'dagrealty' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'dagrealty' }}
        run: uv run scraper/photos.py --all
